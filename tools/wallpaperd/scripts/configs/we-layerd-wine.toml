[general]
backend = "layer_shell"
fps_limit = 30
restart_wine_on_exit = false
refind_window_on_capture_error = true
scale_mode = "cover"
hide_debug_window = false
disable_debug_window_input = true

[isolation]
mode = "gamescope_headless"
command = "/usr/bin/gamescope"
startup_timeout_secs = 30

[wine]
command = "/home/wenmou/.local/share/Steam/compatibilitytools.d/GE-Proton11-7-x86_64/files/bin/wine"
command_mode = "exe_with_args"
wallpaper_exe = "/home/wenmou/Share/Steam/steamapps/common/wallpaper_engine/wallpaper64.exe"
args = ["-control", "openWallpaper", "-file", "/home/wenmou/Share/Steam/steamapps/workshop/content/431960/3479521040/project.json", "-playInWindow", "WE-DEBUG-WINDOW", "-width", "960", "-height", "540"]

[wine.env]
WINEPREFIX = "/home/wenmou/.cache/oh-my-niri/wallpaperd-compare/wine-ge-prefix"
WINEDEBUG = "-all"
WINEDLLOVERRIDES = "winemenubuilder.exe=d;mscoree,mshtml=;d3d11,dxgi=n"
LD_LIBRARY_PATH = "/home/wenmou/.local/share/Steam/compatibilitytools.d/GE-Proton11-7-x86_64/files/lib/x86_64-linux-gnu:/home/wenmou/.local/share/Steam/compatibilitytools.d/GE-Proton11-7-x86_64/files/lib/i386-linux-gnu"
WINEDLLPATH = "/home/wenmou/.local/share/Steam/compatibilitytools.d/GE-Proton11-7-x86_64/files/lib/vkd3d:/home/wenmou/.local/share/Steam/compatibilitytools.d/GE-Proton11-7-x86_64/files/lib/wine"

[capture]
wm_class_contains = "steam_proton"
title_contains = "WE-DEBUG-WINDOW"

[runtime]
mode = "wine_layerd"
wallpaper_type = "scene"

[cgroup]
enabled = false
