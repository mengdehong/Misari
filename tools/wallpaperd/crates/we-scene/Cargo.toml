[package]
name = "we-scene"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1"
glam = "0.30"
glow = "0.17"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
byteorder = "1.5"
lz4_flex = "0.12"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rquickjs = { version = "0.14", default-features = false, features = ["std", "loader"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
rand_chacha = "0.10"
rand_core = "0.10"
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser = { version = "=0.152.0", default-features = false }
oxc_span = "=0.152.0"
texture2ddecoder = "0.1"
shaderc = "0.10"
spirv-cross2 = { version = "0.7", default-features = false, features = ["glsl"] }

wallpaper-media = { path = "../wallpaper-media" }
tempfile = "3"
glsl-lang = { version = "0.8.1", default-features = false }
sha2 = "0.10"
