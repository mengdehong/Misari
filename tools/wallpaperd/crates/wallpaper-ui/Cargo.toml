[package]
name = "wallpaper-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "misari-wallpaper"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "image-without-codecs", "tokio", "advanced-shaping", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
libloading = "0.8"
steamworks = { version = "0.13.1", features = ["raw-bindings"] }
rfd = "0.16"

[dev-dependencies]
tempfile = "3"
