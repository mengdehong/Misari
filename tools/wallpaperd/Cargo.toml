[package]
name = "wallpaperd"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace]
members = ["crates/wallpaper-media", "crates/we-scene", "crates/we-web"]
resolver = "3"

[features]
web = ["dep:we-web"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
fast_image_resize = { version = "6.1", default-features = false, features = ["std", "only_u8x4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
glow = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
libpulse-binding = { version = "2.30", default-features = false }
memmap2 = "0.9"
rustfft = "6.4"
niri-ipc = { path = "../../niri/niri-ipc", default-features = false }
parking_lot = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
we-scene = { path = "crates/we-scene" }
we-web = { path = "crates/we-web", optional = true }
wallpaper-media = { path = "crates/wallpaper-media" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
unicode-width = "0.2"

[profile.dev]
opt-level = 1
lto = "off"
codegen-units = 16
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
tempfile = "3"
wayland-protocols-wlr = { version = "0.3", features = ["server", "client"] }
wayland-server = "0.31"

[[test]]
name = "web_audio"
harness = false
required-features = ["web"]
